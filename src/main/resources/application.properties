spring.application.name=engineary
# データベースへの接続先（ファイル名）を指定 ファイルがないならEntityから自動生成
spring.datasource.url=jdbc:sqlite:engineary.db

# SQLiteを使うためのドライバーを指定
spring.datasource.driver-class-name=org.sqlite.JDBC

# HibernateがSQLiteの書き方（方言）を理解できるようにする
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# エンティティ（Javaクラス）に合わせて自動でテーブルを作成・更新する
spring.jpa.hibernate.ddl-auto=update

# 実行されるSQLをコンソールに表示する（開発中に便利）
spring.jpa.show-sql=true
